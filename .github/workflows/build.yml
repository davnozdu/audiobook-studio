name: macOS ARM app
on:
  push:
    branches: [main, fix/speech-endings-voices, feat/telegram-cloud]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Select current Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Unit tests
        run: |
          STUDIO_CORE_ONLY=1 swift test --package-path native
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_NAME" == feat/telegram-cloud || "$GITHUB_REF_NAME" == main ]]; then
            echo "VERSION=0.5.17-test.4" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_NAME" == fix/speech-endings-voices ]]; then
            echo "VERSION=0.5.16-test.2" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.1.0" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Restore native compilation cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: .build-tools/native-build
          key: studio-native-macos26-${{ hashFiles('native/Package.swift') }}-${{ github.run_id }}
          restore-keys: |
            studio-native-macos26-${{ hashFiles('native/Package.swift') }}-
            studio-native-macos26-
      - name: Build standalone app
        env:
          DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: bash scripts/package.sh
      - name: Save native compilation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .build-tools/native-build
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Sign update archive and feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          KEY_FILE="$RUNNER_TEMP/sparkle.key"
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          SPARKLE_KEY_FILE="$KEY_FILE" python3 scripts/appcast.py
          rm "$KEY_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: AudiobookStudio-arm64
          path: |
            dist/*.zip
            dist/appcast.xml
          compression-level: 0
          retention-days: 14
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/appcast.xml --title "Audiobook Studio $VERSION" --generate-notes
